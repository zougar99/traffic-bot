name: Deploy website to GitHub Pages

# Publishes site/ to https://zougar99.github.io/traffic-bot/
#
# This workflow intentionally uses the classic Pages builder instead of
# actions/deploy-pages: no repository setting or extra permission is required,
# the gh-pages branch is created automatically on the first successful run.

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish site/ to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy site: ${{ github.event.head_commit.message }}"
