<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b11"/>
      <stop offset="55%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#071019"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="95%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94b2d6" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- logo mark -->
  <g transform="translate(84,76)">
    <rect width="76" height="76" rx="20" fill="#0d1117" stroke="#22d3ee" stroke-opacity=".35"/>
    <rect x="18" y="44" width="11" height="15" rx="3" fill="url(#brand)"/>
    <rect x="33" y="33" width="11" height="26" rx="3" fill="url(#brand)"/>
    <rect x="48" y="21" width="11" height="38" rx="3" fill="url(#brand)"/>
    <circle cx="53.5" cy="15" r="3.4" fill="#22d3ee"/>
  </g>

  <text x="180" y="112" font-family="DejaVu Sans, Verdana, sans-serif" font-size="30" font-weight="bold" fill="#e8eef7">Traffic<tspan fill="#22d3ee">Bot</tspan></text>
  <text x="181" y="140" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" letter-spacing="4" fill="#6b7a90">TRAFFIC LAB · v1.0.0</text>

  <!-- headline -->
  <text x="84" y="292" font-family="DejaVu Sans, Verdana, sans-serif" font-size="66" font-weight="bold" fill="#ffffff">Simulate real traffic.</text>
  <text x="84" y="368" font-family="DejaVu Sans, Verdana, sans-serif" font-size="66" font-weight="bold" fill="url(#brand)">Read the signal.</text>

  <text x="86" y="428" font-family="DejaVu Sans, Verdana, sans-serif" font-size="24" fill="#9dabc0">Desktop SEO &amp; analytics lab — proxy rotation, stealth browsing,</text>
  <text x="86" y="464" font-family="DejaVu Sans, Verdana, sans-serif" font-size="24" fill="#9dabc0">search modes, engagement tools and Telegram control.</text>

  <!-- pills -->
  <g font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#a5e9f5">
    <rect x="86" y="512" width="176" height="40" rx="20" fill="#22d3ee" fill-opacity=".10" stroke="#22d3ee" stroke-opacity=".35"/>
    <text x="112" y="538">Electron 26</text>
    <rect x="278" y="512" width="196" height="40" rx="20" fill="#22d3ee" fill-opacity=".10" stroke="#22d3ee" stroke-opacity=".35"/>
    <text x="304" y="538">Selenium</text>
    <rect x="490" y="512" width="196" height="40" rx="20" fill="#22d3ee" fill-opacity=".10" stroke="#22d3ee" stroke-opacity=".35"/>
    <text x="516" y="538">MIT license</text>
  </g>

  <!-- right: stats card -->
  <g transform="translate(760,236)">
    <rect width="356" height="256" rx="26" fill="#0f1622" stroke="#94b2d6" stroke-opacity=".18"/>
    <rect x="24" y="26" width="308" height="1" fill="#94b2d6" fill-opacity=".14"/>
    <text x="28" y="66" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" letter-spacing="2" fill="#6b7a90">THROUGHPUT</text>
    <text x="28" y="126" font-family="DejaVu Sans, Verdana, sans-serif" font-size="52" font-weight="bold" fill="#22d3ee">~900</text>
    <text x="28" y="154" font-family="DejaVu Sans, Verdana, sans-serif" font-size="17" fill="#9dabc0">sessions / hour · 10 proxies</text>
    <g font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#9dabc0">
      <text x="28" y="200">Proxy rotation</text>
      <text x="230" y="200" fill="#7ee787">active</text>
      <text x="28" y="230">Stealth mode</text>
      <text x="230" y="230" fill="#7ee787">active</text>
    </g>
  </g>

  <text x="1116" y="600" text-anchor="end" font-family="DejaVu Sans, Verdana, sans-serif" font-size="17" fill="#4d5d73">github.com/zougar99/traffic-bot</text>
</svg>
